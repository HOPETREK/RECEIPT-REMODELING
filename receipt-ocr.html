<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free receipt reader (OCR)</title>
<style>
:root{--bg:#E8ECEF;--paper:#FBFBF8;--ink:#17202B;--mute:#5A6674;--line:#C9D0D7;--accent:#2F43D9;--accent-ink:#fff;--bad:#B3261E;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#10151B;--paper:#1B222B;--ink:#E9EDF1;--mute:#9AA6B2;--line:#2C3541;--accent:#8D9BFF;--accent-ink:#10151B;--bad:#FF8A80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:24px 20px 48px}
h1{font-size:28px;line-height:1.1;margin:0 0 8px}
.sub{color:var(--mute);margin:0 0 20px}
.btn{display:block;width:100%;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:16px;font-size:17px;font-weight:600;font-family:inherit;cursor:pointer;margin-top:12px}
.btn:disabled{opacity:.5}
video,img{display:none;width:100%;max-height:340px;object-fit:contain;margin-top:16px;border-radius:8px;background:#000}
#status{margin:16px 0;color:var(--mute);min-height:1.5em}
.card{display:none;background:var(--paper);border:1px solid var(--line);padding:16px;font-family:"Courier New",monospace;font-size:15px}
.row{display:flex;justify-content:space-between;gap:12px;padding:4px 0}
.row b{text-align:right}
.warn{color:var(--bad);margin-top:8px;font-family:system-ui,sans-serif;font-size:15px}
.fb{display:none;gap:10px;margin-top:12px}
.fb button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:16px;font-weight:600;font-family:inherit;cursor:pointer}
details{margin-top:16px;color:var(--mute);font-size:14px}
pre{white-space:pre-wrap;background:var(--paper);border:1px solid var(--line);padding:12px;max-height:240px;overflow:auto}
#score{margin-top:20px;color:var(--mute);font-size:15px}
</style>
</head>
<body>
<main>
  <h1>Free receipt reader</h1>
  <p class="sub">Live camera only. Reads the receipt on your phone with free text recognition. Nothing is uploaded.</p>

  <button class="btn" id="open">Open camera</button>
  <video id="cam" playsinline muted></video>
  <button class="btn" id="snap" style="display:none">Capture receipt</button>
  <img id="preview" alt="Your receipt photo">

  <div id="status" role="status"></div>
  <div class="card" id="card">
    <div class="row"><span>Store (guess)</span><b id="o-store"></b></div>
    <div class="row"><span>Date</span><b id="o-date"></b></div>
    <div class="row"><span>Total</span><b id="o-total"></b></div>
    <div class="warn" id="o-warn"></div>
  </div>
  <div class="fb" id="fb">
    <button id="yes">Total is correct</button>
    <button id="no">Total is wrong</button>
  </div>
  <details id="rawbox"><summary>Show the raw text it read</summary><pre id="raw"></pre></details>
  <div id="score"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
const $ = id => document.getElementById(id);
let stream = null, worker = null, right = 0, tested = 0, answered = true;

$("open").onclick = async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } }, audio: false });
  } catch (e) {
    $("status").textContent = "The camera is blocked. Tap the lock icon next to the address, allow Camera, then reload.";
    return;
  }
  const v = $("cam");
  v.srcObject = stream;
  v.style.display = "block";
  await v.play();
  $("snap").style.display = "block";
  $("open").style.display = "none";
  $("preview").style.display = "none";
  $("card").style.display = "none";
  $("fb").style.display = "none";
  $("rawbox").style.display = "none";
  $("status").textContent = "";
};

$("snap").onclick = () => {
  const v = $("cam");
  const c = document.createElement("canvas");
  const s = Math.min(1, 1600 / Math.max(v.videoWidth, v.videoHeight));
  c.width = Math.round(v.videoWidth * s);
  c.height = Math.round(v.videoHeight * s);
  const ctx = c.getContext("2d");
  ctx.drawImage(v, 0, 0, c.width, c.height);
  stream.getTracks().forEach(t => t.stop());
  v.style.display = "none";
  $("snap").style.display = "none";
  $("open").style.display = "block";
  $("open").textContent = "Take another photo";
  // grayscale + contrast to help text recognition
  const img = ctx.getImageData(0, 0, c.width, c.height), d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    let g = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
    g = Math.max(0, Math.min(255, (g - 128) * 1.4 + 128));
    d[i] = d[i + 1] = d[i + 2] = g;
  }
  ctx.putImageData(img, 0, 0);
  $("preview").src = c.toDataURL("image/jpeg", 0.85);
  $("preview").style.display = "block";
  read(c);
};

async function read(canvas) {
  $("open").disabled = true;
  $("status").textContent = "Loading text recognition (first time takes longer)…";
  try {
    if (!worker) {
      worker = await Tesseract.createWorker("eng", 1, {
        logger: m => { if (m.status === "recognizing text") $("status").textContent = "Reading… " + Math.round(m.progress * 100) + "%"; }
      });
    }
    const { data } = await worker.recognize(canvas);
    $("raw").textContent = data.text;
    $("rawbox").style.display = "block";
    show(parse(data.text));
    $("status").textContent = "";
  } catch (e) {
    $("status").textContent = "Couldn’t read that photo. Check your connection (needed once to download the reader) and try again.";
  } finally {
    $("open").disabled = false;
  }
}

function toNumber(s) {
  s = s.replace(/[^\d.,]/g, "");
  const m = s.match(/^(.*)[.,](\d{2})$/);
  if (!m) return NaN;
  return parseFloat(m[1].replace(/[.,]/g, "") + "." + m[2]);
}
const MONEY = /\d{1,3}(?:[.,\s]\d{3})*[.,]\d{2}|\d+[.,]\d{2}/g;

function parse(text) {
  const lines = text.split(/\n/).map(l => l.trim()).filter(Boolean);
  const out = { store: null, date: null, total: null, guessed: false };

  out.store = (lines.find(l => /[A-Za-z]{3,}/.test(l)) || "").replace(/[^A-Za-z0-9&'.\- ]/g, "").trim() || null;

  const dm = text.match(/\b(\d{4}[-\/.]\d{1,2}[-\/.]\d{1,2}|\d{1,2}[-\/.]\d{1,2}[-\/.]\d{2,4}|(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.? \d{1,2},? \d{4})\b/i);
  out.date = dm ? dm[1] : null;

  const totalLines = lines.filter(l => /total|amount due|balance due|amount paid|to pay/i.test(l) && !/sub\s*-?\s*total|total\s*(items|qty|savings|discount)/i.test(l));
  for (let i = totalLines.length - 1; i >= 0; i--) {
    const nums = (totalLines[i].match(MONEY) || []).map(toNumber).filter(n => !isNaN(n));
    if (nums.length) { out.total = nums[nums.length - 1]; break; }
  }
  if (out.total == null) {
    const all = (text.match(MONEY) || []).map(toNumber).filter(n => !isNaN(n));
    if (all.length) { out.total = Math.max(...all); out.guessed = true; }
  }
  return out;
}

function show(r) {
  $("o-store").textContent = r.store || "Not found";
  $("o-date").textContent = r.date || "Not found";
  $("o-total").textContent = r.total != null ? r.total.toFixed(2) : "Not found";
  const w = [];
  if (r.guessed) w.push("No “total” line found, so this is the largest amount on the receipt.");
  if (r.total == null) w.push("Try again with better light and the whole receipt flat in view.");
  w.push("This free version can’t tell if a receipt is fake or edited.");
  $("o-warn").textContent = w.join(" ");
  $("card").style.display = "block";
  $("fb").style.display = "flex";
  answered = false;
}

function mark(ok) {
  if (answered) return;
  answered = true;
  tested++; if (ok) right++;
  $("score").textContent = right + " of " + tested + " totals correct so far.";
  $("fb").style.display = "none";
  $("status").textContent = "Saved. Take another photo to keep testing.";
}
$("yes").onclick = () => mark(true);
$("no").onclick = () => mark(false);
</script>
</body>
</html>
